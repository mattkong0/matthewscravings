        <!-- the rest of the page -->
        <div class="container">
          <h2 style="font-family: 'Chewy', cursive; text-align: center;">Find Your Next Craving!</h2>
          <form id="searchForm" class="form-inline text-center">
            <div class="form-group">
              <label for="craving">Craving:</label>
              <input type="text" class="form-control" id="craving" name="craving" placeholder="e.g., Ramen, Boba" required>
            </div>
            <div class="form-group">
              <label for="location">Location:</label>
              <input type="text" class="form-control" id="location" name="location" placeholder="e.g., San Francisco, CA" required>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
          <hr>
    
          <div id="results-section">
            <h3 style="font-family: 'Poppins', sans-serif; text-align: center;">Recommended Places:</h3>
            <div id="restaurantList" class="row">
              </div>
            <p id="status" class="text-center"></p>
          </div>
        </div>

        <script>
          // Initialize the Google Maps Places Service
          let map, service;

          function initMap() {
            // You can center the map on a default location, like San Francisco
            const sanFrancisco = new google.maps.LatLng(37.7749, -122.4194);
            map = new google.maps.Map(document.getElementById('map'), {
              center: sanFrancisco,
              zoom: 15,
            });
            service = new google.maps.places.PlacesService(map);
          }

          // Function to handle form submission
          document.getElementById('searchForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const craving = document.getElementById('craving').value;
            const locationInput = document.getElementById('location').value;
            const restaurantList = document.getElementById('restaurantList');
            const statusElement = document.getElementById('status');
        
            restaurantList.innerHTML = ''; // Clear previous results
            statusElement.textContent = 'Searching...';

            // Use the Google Maps Geocoding API to get coordinates from the location string
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ 'address': locationInput }, function(results, status) {
              if (status === 'OK' && results[0]) {
                const location = results[0].geometry.location;

                // Now use the PlacesService with the geocoded location
                const request = {
                    location: location,
                    radius: '5000', // Search within a 5km radius
                    type: ['restaurant'],
                    keyword: craving,
                    rankby: google.maps.places.RankBy.PROMINENCE
                };

                service.nearbySearch(request, function(results, status) {
                  if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                    statusElement.textContent = `Found ${results.length} places for "${craving}" in ${locationInput}.`;
                    results.forEach(place => {
                      // Create a card for each restaurant
                      const card = document.createElement('div');
                      card.className = 'col-md-4 col-sm-6';
                            
                      let ratingStars = '';
                      if (place.rating) {
                        const fullStars = Math.floor(place.rating);
                        const halfStar = place.rating % 1 !== 0;
                        for (let i = 0; i < fullStars; i++) {
                          ratingStars += '<span class="fa fa-star checked"></span>';
                        }
                        if (halfStar) {
                          ratingStars += '<span class="fa fa-star-half-o checked"></span>';
                        }
                        ratingStars += ` ${place.rating}`;
                      }

                      card.innerHTML = `
                        <div class="panel panel-default">
                          <div class="panel-heading">
                              <h4 class="panel-title">${place.name}</h4>
                          </div>
                          <div class="panel-body">
                            <p><strong>Rating:</strong> ${ratingStars || 'N/A'}</p>
                            <p><strong>Address:</strong> ${place.vicinity}</p>
                            <a href="https://www.google.com/maps/search/?api=1&query_place_id=${place.place_id}" target="_blank" class="btn btn-info btn-block">View on Maps</a>
                          </div>
                        </div>
                      `;
                      restaurantList.appendChild(card);
                    });
                  } else if (status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) {
                    statusElement.textContent = `No places found for "${craving}" in ${locationInput}.`;
                  } else {
                    statusElement.textContent = `Error fetching data: ${status}`;
                  }
                });
              } else {
                statusElement.textContent = `Geocode was not successful for the following reason: ${status}`;
              }
            });
          });

          // Call initMap when the page loads
          google.maps.event.addDomListener(window, 'load', initMap);
        </script>
